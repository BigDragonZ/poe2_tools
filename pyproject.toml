[project]
name = "poe2-tools"
version = "0.1.0"
description = "POE2 游玩辅助工具：背包整理、战斗巡航、地图、装备"
requires-python = ">=3.11"
dependencies = [
    "pydirectinput",
    "keyboard",
    "mouse",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
