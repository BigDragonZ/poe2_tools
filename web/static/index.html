<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POE2 经济记录</title>
<link rel="icon" href="data:,">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1a1a; color: #d8d8d8;
         font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; }
  a { color: #9ab; }
  /* 顶部一级菜单 */
  .topnav { display: flex; gap: 4px; background: #111; padding: 0 16px;
            border-bottom: 1px solid #333; }
  .topnav .item { padding: 12px 22px; cursor: pointer; color: #888; }
  .topnav .item.active { color: #fff; border-bottom: 2px solid #c8aa6e; background: #1a1a1a; }
  .topnav .item.disabled { color: #555; cursor: not-allowed; }
  .layout { display: flex; min-height: calc(100vh - 46px); }
  /* 左侧边栏：二级菜单 + 其下嵌套的三级菜单（页面）；经济页顶部另有赛季切换区 */
  .sidebar { width: 180px; background: #151515; border-right: 1px solid #2c2c2c;
             display: flex; flex-direction: column; }
  .sidebar .half { padding: 8px 0; overflow-y: auto; }
  .sidebar h4 { margin: 6px 14px; color: #777; font-size: 12px; font-weight: normal; }
  .side-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px;
               cursor: pointer; color: #bbb; white-space: nowrap; }
  .side-item:hover { background: #202020; }
  .side-item.active { background: #2a2a2a; color: #fff; border-left: 3px solid #c8aa6e; }
  .side-item img { width: 22px; height: 22px; }
  /* 侧边栏菜单层级：二级菜单下嵌套三级菜单（页面） */
  .sidebar .half.seasons { flex: none; }
  .sidebar .half.menu { flex: 1; min-height: 0; overflow-y: auto; }
  .side-l2 { padding: 10px 14px 3px; color: #c8aa6e; font-size: 13px; cursor: default;
             user-select: none; }
  .side-item.sub { padding-left: 30px; }
  /* 主区 */
  .main { flex: 1; padding: 16px 20px; overflow-x: auto; }
  .main h2 { margin: 0 0 4px; font-size: 18px; color: #eee; }
  /* 经济页内容区左侧的模块列（页内视图切换，不属于菜单层级） */
  .content-row { display: flex; gap: 18px; align-items: flex-start; }
  .module-col { width: 170px; flex: none; border: 1px solid #2c2c2c; border-radius: 4px;
                background: #181818; padding: 6px 0; }
  .module-col h4 { margin: 4px 12px; color: #777; font-size: 12px; font-weight: normal; }
  .module-col .side-item { padding: 5px 12px; }
  .table-col { flex: 1; min-width: 0; }
  .meta-line { color: #999; margin-bottom: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  select, input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
    background: #222; color: #ddd; border: 1px solid #444; padding: 5px 8px; border-radius: 3px; }
  button { background: #3a3a3a; color: #eee; border: 1px solid #555; padding: 6px 14px;
           border-radius: 3px; cursor: pointer; }
  button:hover { background: #4a4a4a; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: #6b5b2e; border-color: #c8aa6e; }
  .panel { background: #1f1f1f; border: 1px solid #333; border-radius: 4px;
           padding: 10px 14px; margin-bottom: 12px; }
  .panel .panel-title { cursor: pointer; color: #c8aa6e; user-select: none; }
  .panel .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  /* 表格（复刻原站深色样式） */
  table.eco { width: 100%; border-collapse: collapse; background: #1a1a1a; }
  table.eco th { text-align: left; padding: 8px 10px; color: #aaa; font-weight: normal;
                 border-bottom: 2px solid #333; white-space: nowrap; }
  table.eco th.sortable { cursor: pointer; }
  table.eco th.sortable:hover { color: #eee; }
  table.eco td { padding: 6px 10px; border-bottom: 1px solid #262626; vertical-align: middle; }
  table.eco tr:hover td { background: #222; }
  .name-cell { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name-main { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name-main img { width: 32px; height: 32px; flex: none; }
  .name-zh { color: #e8e8e8; }
  .name-en { color: #777; font-size: 11px; }
  .wiki-link { border: 1px solid #555; padding: 2px 6px; font-size: 11px; color: #9ab;
               text-decoration: none; border-radius: 2px; flex: none; }
  .wiki-link:hover { background: #2a2a2a; }
  .value-cell img { width: 24px; height: 24px; vertical-align: middle; margin: 0 2px; }
  .value-sub { color: #888; font-size: 11px; margin-top: 2px; }
  .swap { color: #777; margin: 0 4px; }
  .pos { color: #7ee787; }
  .neg { color: #ff6b6b; }
  .vol { text-align: right; }
  .empty { color: #888; padding: 40px; text-align: center; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #888;
             border-top-color: transparent; border-radius: 50%;
             animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-line { color: #c8aa6e; font-size: 12px; }
  /* 做装流程图 */
  .flow { display: flex; flex-direction: column; align-items: stretch; }
  .flow-center { display: flex; flex-direction: column; align-items: center; }
  .flow-node { border: 1px solid #444; border-radius: 6px; background: #1f1f1f;
               padding: 10px 14px; width: 100%; max-width: 430px; }
  .flow-node .flow-title { color: #c8aa6e; margin-bottom: 6px; }
  .flow-node.goal { border-color: #c8aa6e; }
  .flow-node.module { border-color: #5b7fa6; }
  .flow-node.decision { border-color: #8a6ec8; }
  .flow-node.warn { border-color: #a5533a; }
  .flow-node.done { border-color: #3a8a4a; }
  .flow-node ol { margin: 4px 0 0; padding-left: 20px; }
  .flow-node li { margin: 5px 0; }
  .flow-note { color: #999; font-size: 12px; margin: 3px 0 0 14px; }
  .flow-arrow { display: flex; flex-direction: column; align-items: center; padding: 2px 0; }
  .flow-arrow .line { width: 2px; height: 18px; background: #555; }
  .flow-arrow .head { width: 0; height: 0; border: 5px solid transparent; border-top: 7px solid #555; }
  .flow-arrow .lbl { color: #c8aa6e; font-size: 12px; margin-top: 2px; }
  .flow-branches { display: flex; gap: 16px; align-items: flex-start; justify-content: center; }
  .flow-branch { display: flex; flex-direction: column; align-items: center; width: 360px; flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<!-- JSX 源码：由下方加载器用 classic 运行时编译后执行（babel-standalone 默认的
     automatic 运行时会生成 import 语句，在普通 script 中无法执行） -->
<script type="text/x-jsx" id="app-src">
const { useState, useEffect, useRef, useCallback } = React;

const WEEKDAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

function fmtNum(n, digits = 2) {
  if (n === null || n === undefined) return "-";
  const v = Number(n);
  return Number.isInteger(v) ? String(v) : v.toFixed(digits);
}

function api(path, options) {
  return fetch(path, options).then(r => {
    if (!r.ok) return r.json().then(j => { throw new Error(j.detail || r.statusText); });
    return r.json();
  });
}

// 迷你走势 SVG：用库存的 path d 原样重绘
function Sparkline({ d, color }) {
  if (!d) return <span style={{color: "#666"}}>-</span>;
  return (
    <svg width="60" height="22" style={{verticalAlign: "middle", marginRight: 6}}>
      <path d={d} fill="none" stroke={color === "green" ? "#7ee787" : "#ff6b6b"} strokeWidth="2" />
    </svg>
  );
}

// 24h Value 单元格：重现「2 神聖 ⇄ 1 物品」
function ValueCell({ item, refIcons }) {
  const refIcon = item.ref_currency && refIcons[item.ref_currency];
  const refName = {divine: "神聖", chaos: "混沌", exalted: "崇高"}[item.ref_currency] || item.ref_currency;
  return (
    <div>
      <div className="value-cell">
        {fmtNum(item.ref_amount)}
        {refIcon ? <img src={refIcon} title={refName}/> : <span> {refName} </span>}
        <span className="swap">⇄</span>
        {fmtNum(item.item_amount)}
        {item.icon_path ? <img src={item.icon_path}/> : null}
      </div>
      {item.price_chaos !== null && item.price_chaos !== undefined &&
        <div className="value-sub">≈ {fmtNum(item.price_chaos)} 混沌</div>}
    </div>
  );
}

function EcoTable({ items, refIcons, search, sort, onSort }) {
  const kw = search.trim().toLowerCase();
  let rows = items.filter(it =>
    !kw || (it.name_zh || "").toLowerCase().includes(kw) ||
           (it.name_en || "").toLowerCase().includes(kw));
  const keyFn = {
    price: it => it.price_divine !== null && it.price_divine !== undefined ? it.price_divine : it.price_chaos,
    change: it => it.change_7d_pct,
    volume: it => it.volume_24h,
  }[sort.key];
  if (keyFn) {
    rows = rows.slice().sort((a, b) => {
      const va = keyFn(a), vb = keyFn(b);
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      return sort.dir === "asc" ? va - vb : vb - va;
    });
  }
  const arrow = k => sort.key === k ? (sort.dir === "asc" ? " ▲" : " ▼") : "";
  return (
    <table className="eco">
      <thead>
        <tr>
          <th>名稱</th>
          <th className="sortable" onClick={() => onSort("price")}>24h Value{arrow("price")}</th>
          <th className="sortable" onClick={() => onSort("change")}>Last 7 days{arrow("change")}</th>
          <th className="sortable" style={{textAlign: "right"}} onClick={() => onSort("volume")}>
            24h volume traded{arrow("volume")}</th>
        </tr>
      </thead>
      <tbody>
        {rows.map(it => (
          <tr key={it.slug}>
            <td>
              <div className="name-cell">
                <div className="name-main">
                  {it.icon_path && <img src={it.icon_path} alt=""/>}
                  <div>
                    <div className="name-zh">{it.name_zh}</div>
                    {it.name_en && <div className="name-en">{it.name_en}</div>}
                  </div>
                </div>
                {it.wiki_slug &&
                  <a className="wiki-link" target="_blank" rel="noreferrer"
                     href={"https://poe2db.tw/cn/" + it.wiki_slug}>Wiki</a>}
              </div>
            </td>
            <td><ValueCell item={it} refIcons={refIcons}/></td>
            <td>
              <Sparkline d={it.sparkline_d} color={it.change_color}/>
              {it.change_7d_pct !== null && it.change_7d_pct !== undefined &&
                <span className={it.change_color === "green" ? "pos" : "neg"}>
                  {it.change_7d_pct > 0 ? "+" : ""}{fmtNum(it.change_7d_pct, 0)}%
                </span>}
            </td>
            <td className="vol">{it.volume_24h !== null && it.volume_24h !== undefined ? it.volume_24h : "-"}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// 定时抓取配置面板
function SchedulePanel({ schedule, onSave }) {
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState(schedule);
  const [msg, setMsg] = useState("");
  useEffect(() => setForm(schedule), [schedule]);
  if (!form) return null;
  const save = () => {
    api("/api/schedule", {method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(form)})
      .then(cfg => { onSave(cfg); setMsg("已保存"); setTimeout(() => setMsg(""), 2000); })
      .catch(e => setMsg("保存失败：" + e.message));
  };
  return (
    <div className="panel">
      <div className="panel-title" onClick={() => setOpen(!open)}>
        定时抓取配置 {open ? "▾" : "▸"}
      </div>
      {open && <div>
        <div className="row">
          <label><input type="checkbox" checked={form.enabled}
            onChange={e => setForm({...form, enabled: e.target.checked})}/> 启用定时抓取</label>
        </div>
        <div className="row">
          <span>开服 ≤</span>
          <input type="number" style={{width: 60}} value={form.switch_days}
            onChange={e => setForm({...form, switch_days: Number(e.target.value)})}/>
          <span>天：每天</span>
          <input type="time" value={form.daily_time}
            onChange={e => setForm({...form, daily_time: e.target.value})}/>
          <span>抓取；之后每周</span>
          <select value={form.weekly_day}
            onChange={e => setForm({...form, weekly_day: Number(e.target.value)})}>
            {WEEKDAYS.map((w, i) => <option key={i} value={i}>{w}</option>)}
          </select>
          <input type="time" value={form.weekly_time}
            onChange={e => setForm({...form, weekly_time: e.target.value})}/>
          <span>抓取</span>
          <button onClick={save}>保存</button>
          <span className="status-line">{msg}</span>
        </div>
      </div>}
    </div>
  );
}

// 赛季管理面板
function SeasonPanel({ onCreated }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [startDate, setStartDate] = useState("");
  const [msg, setMsg] = useState("");
  const submit = () => {
    if (!name || !startDate) { setMsg("请填写赛季名称与开服日期"); return; }
    api("/api/seasons", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name, start_date: startDate})})
      .then(s => { setMsg("已新增"); setName(""); onCreated(s); })
      .catch(e => setMsg("失败：" + e.message));
  };
  return (
    <div className="panel">
      <div className="panel-title" onClick={() => setOpen(!open)}>
        赛季管理 {open ? "▾" : "▸"}
      </div>
      {open && <div className="row">
        <input type="text" placeholder="赛季名称，如 0.5.5闪回" value={name}
          onChange={e => setName(e.target.value)}/>
        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)}/>
        <button onClick={submit}>新增赛季</button>
        <span className="status-line">{msg}</span>
      </div>}
    </div>
  );
}

// ---------- 交易页 ----------

// 交易菜单三级页面：与游玩工具「交易」模块的 默认通货/指定/自动 子标签一一对应
const TRADE_PAGES = {
  default: {label: "默认", source: "游玩工具「交易 · 默认通货」抓取同步：崇高石/混沌石/神圣石两两市场比例"},
  custom: {label: "指定", source: "游玩工具「交易 · 指定」抓取同步：指定通货与三种默认通货的市场比例"},
  auto: {label: "自动", source: "游玩工具「交易 · 自动」套利抓取同步：通货快照中 0.5~20 神圣价值区间的候选通货 × 三种默认通货的市场比例"},
};

const BASE_CURS = [
  {unit: "exalted", label: "崇高石"},
  {unit: "chaos", label: "混沌石"},
  {unit: "divine", label: "神圣石"},
];

function unitLabel(u) {
  const b = BASE_CURS.find(c => c.unit === u);
  return b ? b.label : (u.indexOf("item:") === 0 ? u.slice(5) : u);
}

// 单位双名（中文 + 英文，方便游戏内操作对照）；无中文名只显示英文
function unitDualLabel(u, labels) {
  const l = labels && labels[u];
  if (l) return l.zh ? l.zh + " " + l.en : l.en;
  return unitLabel(u);
}

// 单位图标（有本地图标则显示，否则只显示名称）
function UnitIcon({ unit, icons }) {
  const src = icons && icons[unit];
  return src ? <img src={src} style={{width: 20, height: 20, verticalAlign: "middle"}}
                    title={unitLabel(unit)}/> : null;
}

// 最新比例表：按通货对合并成一行，A→B / B→A 两个方向并排、各分买/卖，方便双向对比
function RatesTable({ state }) {
  // 单位排序：三种默认通货按 BASE_CURS 顺序在前，其余按名称
  const unitRank = u => {
    const i = BASE_CURS.findIndex(c => c.unit === u);
    return i >= 0 ? String(i).padStart(2, "0") : "9" + u;
  };
  const groups = {};
  const order = [];
  state.latest.forEach(r => {
    const key = [r.from_unit, r.to_unit].sort().join("<");
    if (!groups[key]) {
      const ab = [r.from_unit, r.to_unit]
        .sort((x, y) => unitRank(x) < unitRank(y) ? -1 : 1);
      groups[key] = {a: ab[0], b: ab[1], rates: {}, latestAt: r.created_at};
      order.push(key);
    }
    const g = groups[key];
    g.rates[r.from_unit + ">" + r.to_unit + ":" + r.side] = r;
    if (r.created_at > g.latestAt) g.latestAt = r.created_at;
  });
  const cell = (g, from, to, side) => {
    const r = g.rates[from + ">" + to + ":" + side];
    if (!r) return <td style={{color: "#555"}}>-</td>;
    return (
      <td>
        {fmtNum(r.amount_from)} : {fmtNum(r.amount_to)}
        <div className="value-sub">
          1 {unitLabel(from)} ≈ {fmtNum(r.amount_to / r.amount_from, 3)} {unitLabel(to)}
        </div>
      </td>
    );
  };
  const buyTh = {color: "#c8aa6e"};
  return (
    <table className="eco" style={{marginTop: 10}}>
      <thead>
        <tr>
          <th>通货对（A ⇄ B）</th>
          <th style={buyTh}>A → B（买）</th>
          <th>A → B（卖）</th>
          <th style={buyTh}>B → A（买）</th>
          <th>B → A（卖）</th>
        </tr>
      </thead>
      <tbody>
        {order.length === 0 &&
          <tr><td colSpan="5" style={{color: "#777"}}>暂无数据，请在游玩工具「交易」页执行对应抓取</td></tr>}
        {order.map(k => {
          const g = groups[k];
          return (
            <tr key={k}>
              <td>
                <UnitIcon unit={g.a} icons={state.unit_icons}/> {unitDualLabel(g.a, state.unit_labels)}
                <span className="swap">⇄</span>
                <UnitIcon unit={g.b} icons={state.unit_icons}/> {unitDualLabel(g.b, state.unit_labels)}
                <div className="value-sub">最近同步：{g.latestAt}</div>
              </td>
              {cell(g, g.a, g.b, "buy")}
              {cell(g, g.a, g.b, "sell")}
              {cell(g, g.b, g.a, "buy")}
              {cell(g, g.b, g.a, "sell")}
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

// 市场比例面板：本类别当前生效的汇率（只读展示，数据来自游玩工具同步；
// 通货↔金币的 Currency Exchange 值为固定值，信息库已有，不在此展示）
function MarketRatePanel({ state }) {
  return (
    <div className="panel">
      <div className="panel-title" style={{cursor: "default"}}>
        市场比例（游玩工具抓取同步，同方向只保留最近一次）
      </div>
      <RatesTable state={state}/>
    </div>
  );
}

// 最佳套利方案（每轮口径）：套利核心是金币换通货，不关注当前持仓——
// 以 1 单位起点通货为单独一轮，收益 = 通货互换价差（环终值 - 1），
// 效率 = 价差折神圣 / 每轮金币费（每 1 万金币净得多少神圣当量，即通货/万金币转换率）
function ArbitragePanel({ state }) {
  const ul = u => unitDualLabel(u, state.unit_labels);
  const plan = state.arb_plan;
  const opps = (state.opportunities || []).slice(0, 5);
  return (
    <div className="panel">
      <div className="panel-title" style={{cursor: "default"}}>
        最佳套利方案（每轮口径：1 单位起点通货，金币费实付）
      </div>
      {!plan &&
        <div style={{color: "#777", marginTop: 8}}>
          暂无可套利兑换环：需同步比例后存在价差为正、且金币费（Currency Exchange 值）已知的环
        </div>}
      {plan &&
        <div style={{marginTop: 8}}>
          <div className="row" style={{marginTop: 0}}>
            <span>起点 <UnitIcon unit={plan.start_unit} icons={state.unit_icons}/> <b>{ul(plan.start_unit)}</b>，</span>
            <span>每轮价差 <b className="pos">+{fmtNum((plan.rate - 1) * 100, 2)}%</b>
              <span style={{color: "#777", fontSize: 11}}>（1 → {fmtNum(plan.final_amount, 4)}）</span>，</span>
            <span>每轮净得 <b className="pos">{fmtNum(plan.profit_units, 4)}</b> {ul(plan.start_unit)}
              <span style={{color: "#777", fontSize: 11}}>（折神圣 {fmtNum(plan.profit_divine_per_loop, 4)}）</span></span>
          </div>
          <div className="row" style={{marginTop: 4}}>
            <span>每轮金币费 <b>{plan.total_gold_fee === null || plan.total_gold_fee === undefined
              ? "-" : fmtNum(plan.total_gold_fee, 0)}</b>，</span>
            <span>每 1 万金币净得 <b className="pos">
              {plan.divine_per_10k_gold === null || plan.divine_per_10k_gold === undefined
                ? "-" : fmtNum(plan.divine_per_10k_gold, 4)}</b> 神圣当量
              <span style={{color: "#777", fontSize: 11}}>（通货/万金币转换率）</span></span>
          </div>
          <table className="eco" style={{marginTop: 8}}>
            <thead><tr><th>步骤</th><th>付出</th><th>获得</th><th>市场比例</th><th>金币费</th></tr></thead>
            <tbody>
              {plan.steps.map((s, i) => (
                <tr key={i}>
                  <td>{i + 1}</td>
                  <td>
                    <UnitIcon unit={s.from_unit} icons={state.unit_icons}/> {fmtNum(s.pay, 4)} {ul(s.from_unit)}
                  </td>
                  <td>
                    <UnitIcon unit={s.to_unit} icons={state.unit_icons}/> {fmtNum(s.receive, 4)} {ul(s.to_unit)}
                  </td>
                  <td>{fmtNum(s.amount_from, 4)} : {fmtNum(s.amount_to, 4)}
                    {s.side === "buy" &&
                      <span style={{color: "#c8aa6e", fontSize: 11}} title="市场买入，需付金币费"> [买]</span>}
                  </td>
                  <td>{s.gold_fee === null || s.gold_fee === undefined
                        ? "-" : fmtNum(s.gold_fee, 0) + " 金币"}</td>
                </tr>
              ))}

          </table>
          <div style={{marginTop: 6, color: "#999"}}>
            以上为单独一轮（1 单位起点通货）的步骤与消耗；实际每轮规模受市场挂单深度限制，建议小额多次
          </div>
          {plan.check &&
            <div style={{marginTop: 4, fontSize: 12}}>
              {plan.check.ok
                ? <span className="pos">复核一致：已按原始比例独立重算终值与金币费，与方案相符</span>
                : <span className="neg">复核不一致：{plan.check.discrepancies.join("；")}</span>}
            </div>}
        </div>}
      {opps.length > 0 &&
        <table className="eco" style={{marginTop: 8}}>
          <thead><tr><th>备选方案</th><th>起点</th><th>每轮价差</th><th>每轮金币费</th><th>每 1 万金币净得（神圣当量）</th></tr></thead>
          <tbody>
            {opps.map((o, i) => (
              <tr key={i}>
                <td>{i + 1}</td>
                <td><UnitIcon unit={o.start_unit} icons={state.unit_icons}/> {ul(o.start_unit)}</td>
                <td>+{fmtNum((o.rate - 1) * 100, 2)}%</td>
                <td>{o.total_gold_fee === null || o.total_gold_fee === undefined
                      ? "-" : fmtNum(o.total_gold_fee, 0)}</td>
                <td>{o.divine_per_10k_gold === null || o.divine_per_10k_gold === undefined
                      ? "-" : fmtNum(o.divine_per_10k_gold, 4)}</td>
              </tr>
            ))}
          </tbody>
        </table>}
    </div>
  );
}

];

function FlowArrow({ label }) {
  return (
    <div className="flow-arrow">
      <div className="line"></div>
      <div className="head"></div>
      {label && <div className="lbl">{label}</div>}
    </div>
  );
}

function FlowNode({ tone, title, children }) {
  return (
    <div className={"flow-node" + (tone ? " " + tone : "")}>
      {title && <div className="flow-title">{title}</div>}
      {children}
    </div>
  );
}

// 戒指 · 稀有度：52% 稀有度 + 双 T1 点伤 + 抗性戒指
function RingRarityFlow() {
  return (
    <div className="flow">
      <div className="flow-center">
        <FlowNode tone="goal" title="目标">
          52% 稀有度 + 双 T1 点伤 + 抗性戒指
        </FlowNode>
        <FlowArrow/>
        <FlowNode tone="module" title="模块 1 ｜ 底材">
          <ol>
            <li>购买锁后缀的 T1 稀有度「金光戒指」（82 物等底材）
              <div className="flow-note">
                注意：后续要用品质工艺，锁的词条必须是非工艺词条 —— 按住 Alt 可查看词条是否为工艺词条
              </div>
            </li>
            <li>使用剥离石，剥离到只剩「一条词缀 + 锁的词缀」</li>
            <li>使用混沌石开始 C</li>
          </ol>
        </FlowNode>
        <FlowArrow/>
        <FlowNode tone="decision" title="判定">混沌石 C 出的最好词条是？</FlowNode>
      </div>
      <div className="flow-branches">
        <div className="flow-branch">
          <FlowArrow label="T1 点伤（最佳）"/>
          <FlowNode tone="module" title="模块 2.1 ｜ 双点伤 + 品质">
            <ol>
              <li>完美崇高石 + 左旋 + 攻击（掠夺）催化剂「喜悦」
                <div className="flow-note">
                  出 T2 点伤：批量做或自用都可保留；不想要就剥离重来 —— 剥离错了需重复模块 1 → 本步，成本较高
                </div>
              </li>
              <li>右旋 + 普通崇高石，打一个后缀</li>
              <li>购买品质精华 → 右旋结晶：用精华吃掉第 2 步的后缀，打上品质精华（+20% 品质）
                <div className="flow-note">备注 1：用攻击催化剂打满 40 品质，确保攻击词缀都能吃到加成</div>
                <div className="flow-note">备注 2：缺抗性可换对应抗性催化剂，对应点伤 + 对应抗性（全抗）都能享受催化剂效果</div>
              </li>
              <li>削切 + 混沌石：若 C 出前缀则继续削切，直到出现后缀
                <div className="flow-note">备注 1：+20% 品质是 C 词条、最低级别词条，削切必定吃掉它（同类还有深渊解密词条）</div>
                <div className="flow-note">备注 2：用普通混沌石确保出现的是低等级词缀，削切可精准命中</div>
              </li>
              <li>前缀「古老的骨头」+ 左旋死灵，占掉前缀词条（可先解密，也可最后解密）</li>
            </ol>
          </FlowNode>
          <FlowArrow/>
          <FlowNode tone="module" title="模块 3 ｜ 洗后缀">
            <ol>
              <li>检查后缀是否满意；不满意则先看是否缺抗性</li>
              <li>缺抗性 → 参照模块 2.1 备注 2，换对应抗性催化剂补抗性</li>
              <li>不缺抗性 → 右旋结晶 + 迅捷合金：吃掉模块 2.1 第 4 步 C 出的后缀，打上攻击速度</li>
              <li>完美崇高石 E 一手，查看结果</li>
              <li>不理想 → 右旋废止 + 剥离，洗掉一条后缀</li>
              <li>回到第 1 步重复，直到洗出想要的后缀</li>
            </ol>
          </FlowNode>
          <FlowArrow label="后缀满意"/>
          <FlowNode tone="done" title="完成">52% 稀有度 + 双 T1 点伤 + 抗性戒指</FlowNode>
        </div>
        <div className="flow-branch">
          <FlowArrow label="T1 前缀稀有"/>
          <FlowNode tone="warn" title="分支 2.2 ｜ 放弃双点伤">
            不要强行做双 T1 点伤戒指 —— 后续「古老的骨头」解密成本太高。
          </FlowNode>
        </div>
        <div className="flow-branch">
          <FlowArrow label="T1 全抗"/>
          <FlowNode tone="warn" title="分支 2.3 ｜ 看经济条件">
            经济条件不好就按「T1 前缀稀有」同样处理，不强行投入。
          </FlowNode>
        </div>
      </div>
    </div>
  );
}

function LibraryPage({ modules }) {
  const [items, setItems] = useState(null);
  const [search, setSearch] = useState("");
  const [moduleSlug, setModuleSlug] = useState("");
  const [refreshing, setRefreshing] = useState(false);
  const [statusText, setStatusText] = useState("");
  const [sort, setSort] = useState({key: null, dir: "desc"});
  const pollRef = useRef(null);

  const load = useCallback((kw, slug) => {
    const params = [];
    if (kw && kw.trim()) params.push("search=" + encodeURIComponent(kw.trim()));
    if (slug) params.push("module_slug=" + encodeURIComponent(slug));
    api("/api/library" + (params.length ? "?" + params.join("&") : ""))
      .then(j => setItems(j.items)).catch(() => setItems([]));
  }, []);

  // 搜索/模块筛选防抖后走服务端检索
  useEffect(() => {
    const t = setTimeout(() => load(search, moduleSlug), 300);
    return () => clearTimeout(t);
  }, [search, moduleSlug, load]);

  useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  const pollStatus = () => {
    if (pollRef.current) clearInterval(pollRef.current);
    pollRef.current = setInterval(() => {
      api("/api/library/status").then(st => {
        if (st.running) {
          setStatusText("抓取中：" + (st.current_item || "") + " (" + st.done + "/" + st.total + ")");
        } else {
          clearInterval(pollRef.current);
          pollRef.current = null;
          setRefreshing(false);
          setStatusText(st.error ? "抓取失败：" + st.error
                                 : "抓取完成，更新 " + st.updated + " 条");
          load(search, moduleSlug);
          setTimeout(() => setStatusText(""), 4000);
        }
      }).catch(() => {});
    }, 1000);
  };

  const doRefresh = mode => {
    setRefreshing(true);
    setStatusText("启动抓取…");
    api("/api/library/refresh?mode=" + mode, {method: "POST"})
      .then(() => pollStatus())
      .catch(e => { setRefreshing(false); setStatusText("启动失败：" + e.message); });
  };

  const onSort = key => setSort(s => ({
    key, dir: s.key === key && s.dir === "desc" ? "asc" : "desc",
  }));
  const arrow = k => sort.key === k ? (sort.dir === "asc" ? " ▲" : " ▼") : "";

  let rows = items || [];
  if (sort.key === "gold") {
    rows = rows.slice().sort((a, b) => {
      const va = a.gold_cost, vb = b.gold_cost;
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      return sort.dir === "asc" ? va - vb : vb - va;
    });
  }

  return (
    <div className="main">
      <h2>信息库</h2>
      <div className="meta-line">
        物品中/英文名称、所属模块、Wiki 链接与 Currency Exchange（市场交易时每单位消耗的金币），支持中英文检索
      </div>
      <div className="toolbar">
        <input type="text" placeholder="搜索名称 / 模块（中/英文）" value={search}
          onChange={e => setSearch(e.target.value)} style={{width: 220}}/>
        <select value={moduleSlug} onChange={e => setModuleSlug(e.target.value)}>
          <option value="">全部模块</option>
          {modules.map(m => <option key={m.slug} value={m.slug}>{m.name_zh}</option>)}
        </select>
        <button className="primary" disabled={refreshing} onClick={() => doRefresh("missing")}>
          {refreshing && <span className="spinner"></span>}抓取 Wiki 信息
        </button>
        <button disabled={refreshing} title="重新抓取全部物品的 wiki 信息（耗时较长）"
          onClick={() => doRefresh("all")}>全部重抓</button>
        <span className="status-line">{statusText}</span>
      </div>
      {items === null ? <div className="empty">加载中…</div> :
       rows.length === 0 ? <div className="empty">暂无数据，请先在经济页抓取模块数据</div> :
      <table className="eco">
        <thead>
          <tr>
            <th>名称</th>
            <th>模块</th>
            <th className="sortable" style={{textAlign: "right"}} onClick={() => onSort("gold")}>
              Currency Exchange（金币）{arrow("gold")}</th>
            <th>Wiki</th>
            <th>更新时间</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(it => (
            <tr key={it.item_id}>
              <td>
                <div className="name-main">
                  {it.icon_path && <img src={it.icon_path} alt=""/>}
                  <div>
                    <div className="name-zh">{it.name_zh}</div>
                    {it.name_en && <div className="name-en">{it.name_en}</div>}
                  </div>
                </div>
              </td>
              <td>
                <div className="name-zh">{it.module_name_zh}</div>
                <div className="name-en">{it.module_slug}</div>
              </td>
              <td className="vol">
                {it.gold_cost !== null && it.gold_cost !== undefined
                  ? fmtNum(it.gold_cost, 0) + " 金币" : "-"}
              </td>
              <td>
                {it.wiki_slug &&
                  <a className="wiki-link" target="_blank" rel="noreferrer"
                     href={it.wiki_url || ("https://poe2db.tw/cn/" + it.wiki_slug)}>Wiki</a>}
              </td>
              <td style={{color: "#888"}}>{it.info_fetched_at || "-"}</td>
            </tr>
          ))}
        </tbody>
      </table>}
    </div>
  );
}

function App() {
  // 菜单标准：顶部一级菜单 → 左侧边栏二级菜单 → 二级菜单下嵌套三级菜单（页面）
  const [page, setPage] = useState("economy");  // 一级菜单：economy | trade | craft
  const [ecoView, setEcoView] = useState("module");  // 经济三级页面：module | library
  const [tradeView, setTradeView] = useState("default");  // 交易三级页面：default | custom | auto
  const [craftSection, setCraftSection] = useState("ring");  // 做装二级菜单：装备部位
  const [craftPage, setCraftPage] = useState("ring-rarity");  // 做装三级菜单：页面
  const [seasons, setSeasons] = useState([]);
  const [seasonId, setSeasonId] = useState(null);
  const [modules, setModules] = useState([]);
  const [moduleSlug, setModuleSlug] = useState("Economy_Currency");
  const [data, setData] = useState(null);
  const [days, setDays] = useState([]);
  const [day, setDay] = useState(null);       // null = 最新
  const [meta, setMeta] = useState(null);
  const [schedule, setSchedule] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [statusText, setStatusText] = useState("");
  const [search, setSearch] = useState("");
  const [sort, setSort] = useState({key: null, dir: "desc"});
  const pollRef = useRef(null);

  const loadMeta = () => api("/api/meta").then(setMeta).catch(() => {});

  useEffect(() => {
    api("/api/seasons").then(list => {
      setSeasons(list);
      if (list.length) setSeasonId(list[0].id);  // 默认当前赛季（start_date 最新者）
    }).catch(() => {});
    api("/api/modules").then(setModules).catch(() => {});
    api("/api/schedule").then(setSchedule).catch(() => {});
    loadMeta();
  }, []);

  const loadEconomy = useCallback((sid, slug, d) => {
    if (!sid) { setData(null); return; }
    let url = "/api/economy/" + slug + "?season_id=" + sid;
    if (d !== null && d !== undefined) url += "&day=" + d;
    api(url).then(setData).catch(() => setData(null));
  }, []);

  const loadDays = useCallback((sid, slug) => {
    if (!sid) { setDays([]); return; }
    api("/api/economy/" + slug + "/days?season_id=" + sid)
      .then(j => setDays(j.days)).catch(() => setDays([]));
  }, []);

  useEffect(() => {
    setDay(null);
    loadDays(seasonId, moduleSlug);
    loadEconomy(seasonId, moduleSlug, null);
  }, [seasonId, moduleSlug]);

  // 轮询刷新状态
  const pollStatus = () => {
    if (pollRef.current) clearInterval(pollRef.current);
    pollRef.current = setInterval(() => {
      api("/api/refresh_status").then(st => {
        if (st.running) {
          setStatusText("刷新中：" + (st.current_module || "") + " (" + st.done + "/" + st.total + ")");
        } else {
          clearInterval(pollRef.current);
          pollRef.current = null;
          setRefreshing(false);
          setStatusText(st.error ? "刷新失败：" + st.error : "刷新完成");
          loadDays(seasonId, moduleSlug);
          loadEconomy(seasonId, moduleSlug, day);
          loadMeta();
          setTimeout(() => setStatusText(""), 4000);
        }
      }).catch(() => {});
    }, 1000);
  };

  const doRefresh = () => {
    setRefreshing(true);
    setStatusText("启动刷新…");
    api("/api/refresh/" + moduleSlug, {method: "POST"})
      .then(() => pollStatus())
      .catch(e => { setRefreshing(false); setStatusText("刷新失败：" + e.message); });
  };

  const onSort = key => setSort(s => ({
    key, dir: s.key === key && s.dir === "desc" ? "asc" : "desc",
  }));

  const season = seasons.find(s => s.id === seasonId);
  const curModule = modules.find(m => m.slug === moduleSlug);

  return (
    <div>
      <div className="topnav">
        <div className={"item" + (page === "economy" ? " active" : "")}
             onClick={() => { setPage("economy"); setEcoView("module"); }}>经济</div>
        <div className={"item" + (page === "trade" ? " active" : "")}
             onClick={() => setPage("trade")}>交易</div>
        <div className="item disabled" title="暂未开放">策略</div>
        <div className={"item" + (page === "craft" ? " active" : "")}
             onClick={() => setPage("craft")}>做装</div>
        <div className="item disabled" title="暂未开放">开荒</div>
      </div>
      <div className="layout">
        <div className="sidebar">
          {page === "craft" ? (
          <div className="half menu">
            {CRAFT_MENU.map(g => (
              <React.Fragment key={g.key}>
                <div className="side-l2">{g.label}</div>
                {g.pages.map(p => (
                  <div key={p.key}
                       className={"side-item sub" + (g.key === craftSection && p.key === craftPage ? " active" : "")}
                       onClick={() => { setCraftSection(g.key); setCraftPage(p.key); }}>{p.label}</div>
                ))}
              </React.Fragment>
            ))}
          </div>
          ) : page === "trade" ? (
          <div className="half menu">
            <div className="side-l2">市场比例</div>
            {Object.keys(TRADE_PAGES).map(k => (
              <div key={k}
                   className={"side-item sub" + (tradeView === k ? " active" : "")}
                   onClick={() => setTradeView(k)}>{TRADE_PAGES[k].label}</div>
            ))}
          </div>
          ) : (
          <React.Fragment>
          <div className="half seasons">
            <h4>赛季</h4>
            {seasons.length === 0 && <div className="side-item" style={{color: "#666"}}>尚未录入赛季</div>}
            {seasons.map(s => (
              <div key={s.id} className={"side-item" + (s.id === seasonId ? " active" : "")}
                   onClick={() => { setSeasonId(s.id); setEcoView("module"); }}>{s.name}</div>
            ))}
          </div>
          <div className="half menu">
            <div className="side-l2">工具</div>
            <div className={"side-item sub" + (ecoView === "library" ? " active" : "")}
                 onClick={() => setEcoView("library")}>信息库</div>
          </div>
          </React.Fragment>
          )}
        </div>
        {page === "craft" ? <CraftPage section={craftSection} page={craftPage}/> :
         page === "trade" ? <TradePage category={tradeView}/> :
         ecoView === "library" ? <LibraryPage modules={modules}/> :
        <div className="main">
          <h2>{curModule ? curModule.name_zh : moduleSlug}</h2>
          <div className="meta-line">
            {season ? (
              <span>赛季：{season.name} ｜ 开服：{season.start_date} ｜
                今天是开服第 {data ? data.today_day : "-"} 天
                {data && data.day ? " ｜ 当前查看：第 " + data.day + " 天" : ""}
                {data && data.fetched_at ? " ｜ 抓取时间：" + data.fetched_at : ""}
              </span>
            ) : <span>请先在「赛季管理」中新增赛季</span>}
            {meta && meta.chaos_per_divine &&
              <span> ｜ 汇率：1 神聖 ≈ {fmtNum(meta.chaos_per_divine, 1)} 混沌</span>}
          </div>
          <div className="toolbar">
            <span>开服天数：</span>
            <select value={day === null ? "" : day}
              onChange={e => {
                const v = e.target.value === "" ? null : Number(e.target.value);
                setDay(v);
                loadEconomy(seasonId, moduleSlug, v);
              }}>
              <option value="">最新</option>
              {days.map(d => <option key={d} value={d}>第 {d} 天</option>)}
            </select>
            <input type="text" placeholder="搜索物品名（中/英文）" value={search}
              onChange={e => setSearch(e.target.value)} style={{width: 200}}/>
            <button className="primary" disabled={refreshing || !season} onClick={doRefresh}>
              {refreshing && <span className="spinner"></span>}刷新本模块
            </button>
            <span className="status-line">{statusText}</span>
          </div>
          <SchedulePanel schedule={schedule} onSave={setSchedule}/>
          <SeasonPanel onCreated={s => {
            api("/api/seasons").then(list => { setSeasons(list); setSeasonId(s.id); });
          }}/>
          <div className="content-row">
            <div className="module-col">
              <h4>经济模块</h4>
              {modules.map(m => (
                <div key={m.slug} className={"side-item" + (m.slug === moduleSlug ? " active" : "")}
                     onClick={() => setModuleSlug(m.slug)}>
                  {m.icon_path && <img src={m.icon_path} alt=""/>}
                  <span>{m.name_zh}</span>
                </div>
              ))}
            </div>
            <div className="table-col">
              {data && data.items && data.items.length > 0 ?
                <EcoTable items={data.items} refIcons={data.ref_icons || {}}
                          search={search} sort={sort} onSort={onSort}/> :
                <div className="empty">暂无数据，请点击刷新本模块抓取</div>}
            </div>
          </div>
        </div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

  s.textContent = code;

</body>
</html>
